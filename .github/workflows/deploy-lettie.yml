name: 🚀 Déploiement automatique LETTIE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to LETTIE VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST_LETTIE }}
          username: ${{ secrets.VPS_USER_LETTIE }}
          key: ${{ secrets.VPS_SSH_KEY_LETTIE }}

          script: |
            set -e

            cd /var/www/vhosts/belej-erp.com/lettie.belej-erp.com

            echo "=== Fetching GitHub ==="
            git fetch origin main

            echo "=== Deploying ==="
            git reset --hard origin/main

            echo "=== Fixing permissions ==="
            chown -R belej-erp.com_w1byz3rcb7a:psacln /var/www/vhosts/belej-erp.com/lettie.belej-erp.com
            # Plesk: Apache runs in the group psaserv. The site folder and its document root must
            # belong to that group, or Apache cannot enter them (403, "unable to check htaccess file").
            chown belej-erp.com_w1byz3rcb7a:psaserv /var/www/vhosts/belej-erp.com/lettie.belej-erp.com /var/www/vhosts/belej-erp.com/lettie.belej-erp.com/public
            chmod 750 /var/www/vhosts/belej-erp.com/lettie.belej-erp.com /var/www/vhosts/belej-erp.com/lettie.belej-erp.com/public

            echo "=== Current version ==="
            git log -1 --oneline

            echo "=== Deployment completed ==="